name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify committed dist/ matches src/
        run: |
          git diff --exit-code dist/ \
            || { echo "::error::dist/ is out of date — run 'npm run build' and commit dist/seestar-card.js"; exit 1; }
